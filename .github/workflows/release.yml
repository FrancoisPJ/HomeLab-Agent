name: Release

# CD: every push to main publishes `edge` images (except the CUDA one); a `v*` tag (pushed, or
# created with a release in the GitHub UI) publishes every versioned image and a GitHub release.
# Images go to the GitHub Container Registry of the repository owner.
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  plan:
    name: Plan images
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        # the CUDA image takes long to compile: publish it for versions (tag / release) and on
        # demand only; pushes to main publish the other `edge` images (CI still builds it)
        run: |
          images='[
            {"name": "agent", "file": "docker/agent.Dockerfile"},
            {"name": "llama-cpu", "file": "docker/llama-cpu.Dockerfile"},
            {"name": "whisper", "file": "docker/whisper.Dockerfile"},
            {"name": "tts", "file": "docker/tts.Dockerfile"},
            {"name": "fakes", "file": "docker/fake-llm/Dockerfile"}'
          if [ "${{ github.event_name }}" != "push" ] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            images="$images"', {"name": "llama-gpu", "file": "docker/llama-gpu.Dockerfile"}'
          fi
          echo "matrix={\"include\": $images]}" | tr -d '\n' >> "$GITHUB_OUTPUT"
          echo >> "$GITHUB_OUTPUT"

  images:
    name: Publish ${{ matrix.name }}
    needs: [plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space (CUDA image)
        if: matrix.name == 'llama-gpu'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/homelab-agent-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  github-release:
    name: GitHub release
    # a release published from the UI already exists: only create one for pushed tags
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [images]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: docs/release-notes.md
