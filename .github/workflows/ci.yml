name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: ruff
        run: |
          uv run ruff check . --output-format=github
          uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy
      - name: config schema is up to date
        run: uv run homelab-agent schema | diff -u config.schema.json -
      - name: example config is valid
        run: uv run homelab-agent -c config.example.yaml check-config

  test:
    name: Tests (fake backends)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks on the whole history
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.29.1 git /repo --redact -v --exit-code 1

  docker:
    name: Build image ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            file: docker/agent.Dockerfile
          - name: fakes
            file: docker/fake-llm/Dockerfile
          - name: llama-cpu
            file: docker/llama-cpu.Dockerfile
          - name: llama-gpu
            file: docker/llama-gpu.Dockerfile
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space (CUDA image)
        if: matrix.name == 'llama-gpu'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: homelab-agent-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  e2e:
    name: End-to-end (compose dev profile)
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Start dev stack
        run: docker compose --profile dev up -d --build --wait
      - name: Scenario
        run: HLA_E2E=1 uv run pytest -m e2e tests/e2e -v
      - name: Logs
        if: always()
        run: docker compose --profile dev logs --tail=200
      - name: Stop
        if: always()
        run: docker compose --profile dev down -v
