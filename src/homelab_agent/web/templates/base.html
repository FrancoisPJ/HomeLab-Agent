<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>homelab-agent · {% block title %}{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header>
  <strong>🏠 homelab-agent</strong>
  {% set p = request.url.path %}
  <a href="/" class="{{ 'on' if p == '/' }}">État</a>
  <a href="/permissions" class="{{ 'on' if p.startswith('/permissions') }}">Permissions</a>
  <a href="/budget" class="{{ 'on' if p == '/budget' }}">Budget</a>
  <a href="/jobs" class="{{ 'on' if p == '/jobs' }}">Tâches</a>
  <a href="/audit" class="{{ 'on' if p == '/audit' }}">Audit</a>
  <a href="/config" class="{{ 'on' if p == '/config' }}">Configuration</a>
  <form method="post" action="/logout"><button class="ghost">Déconnexion</button></form>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
