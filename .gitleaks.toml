# gitleaks configuration: default rules + allowlist for obviously fake test values.
[extend]
useDefault = true

[allowlist]
description = "fake values used by tests, examples and the dev profile"
regexes = [
  '''123456:fake-dev-token''',
  '''123456:TEST''',
  '''000000000:REPLACE_ME''',
  '''dev-password-123''',
  '''fake-ha-token''',
  '''correct-horse-battery''',
]
paths = ['''uv\.lock''']
