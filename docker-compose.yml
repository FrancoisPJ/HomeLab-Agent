# homelab-agent — Docker Compose
#
# Profils :
#   full      agent + llama-gpu + llama-cpu   (serveur avec GPU NVIDIA)
#   cpu-only  agent + llama-cpu               (pas de GPU : le niveau GPU bascule sur le CPU)
#   no-gpu    agent seul                      (moteurs ailleurs ou cloud uniquement)
#   dev       agent + faux services (LLM, Home Assistant, Telegram, voix) — aucune dépendance réelle
#   monitoring  Prometheus + Grafana (tableau de bord fourni) : make up PROFILE=full,monitoring
#   voice     voix : transcription (whisper.cpp) et synthèse (Piper), à ajouter à un autre profil :
#             make up PROFILE=full,voice   (= COMPOSE_PROFILES=full,voice docker compose up -d)
#
#   make up                 # = docker compose --profile full up -d
#   docker compose --profile cpu-only up -d
#   docker compose --profile dev up --build
#
# Rien n'écoute publiquement : le panneau est publié sur 127.0.0.1 uniquement et les
# moteurs llama.cpp (sans authentification) restent sur le réseau interne Compose.

x-agent: &agent
  build:
    context: .
    dockerfile: docker/agent.Dockerfile
  image: homelab-agent:local
  restart: unless-stopped
  user: "${HLA_UID:-1000}:${HLA_GID:-1000}"
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-llama: &llama
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  expose: ["8080"]

services:
  agent:
    <<: *agent
    profiles: [full, cpu-only, no-gpu]
    env_file: .env
    volumes:
      - ./config.yaml:/config/config.yaml
      - ./data:/data
    ports:
      - "127.0.0.1:${PANEL_PORT:-8099}:8099"

  llama-gpu:
    <<: *llama
    profiles: [full]
    build:
      context: .
      dockerfile: docker/llama-gpu.Dockerfile
      args:
        CUDA_VERSION: "${CUDA_VERSION:-12.2.2}"
        CUDA_ARCHITECTURES: "${CUDA_ARCHITECTURES:-86}"
    image: homelab-agent-llama-gpu:local
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
      - ./engines/llama-swap-gpu.yaml:/config/llama-swap.yaml:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  llama-cpu:
    <<: *llama
    profiles: [full, cpu-only]
    build:
      context: .
      dockerfile: docker/llama-cpu.Dockerfile
    image: homelab-agent-llama-cpu:local
    mem_limit: "${LLAMA_CPU_MEM_LIMIT:-12g}"
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
      - ./engines/llama-swap-cpu.yaml:/config/llama-swap.yaml:ro

  whisper:
    <<: *llama
    profiles: [voice]
    build:
      context: .
      dockerfile: docker/whisper.Dockerfile
    image: homelab-agent-whisper:local
    env_file:
      - path: ./engines/whisper.env
        required: false
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro

  tts:
    <<: *llama
    profiles: [voice]
    build:
      context: .
      dockerfile: docker/tts.Dockerfile
    image: homelab-agent-tts:local
    env_file:
      - path: ./engines/tts.env
        required: false
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro

  # ------------------------------------------------------------ monitoring profile
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [monitoring]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      # token that only grants /metrics (same value as METRICS_TOKEN of the agent, in .env)
      METRICS_TOKEN: "${METRICS_TOKEN:-dev-metrics-token-0123456789}"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        printf %s "$$METRICS_TOKEN" > /tmp/metrics_token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=30d
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose: ["9090"]

  grafana:
    image: grafana/grafana:13.2.5
    profiles: [monitoring]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/homelab-agent.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]

  # ------------------------------------------------------------------ dev profile
  agent-dev:
    <<: *agent
    profiles: [dev]
    user: "10001:10001"
    environment:
      # writable copy of the template on first start (routines created from the chat)
      HLA_CONFIG: /data/config.yaml
      HLA_CONFIG_TEMPLATE: /config/config.dev.yaml
      METRICS_TOKEN: dev-metrics-token-0123456789
      TELEGRAM_BOT_TOKEN: "123456:fake-dev-token"
      HA_TOKEN: fake-ha-token
      PANEL_PASSWORD: dev-password-123
    volumes:
      - ./deploy/config.dev.yaml:/config/config.dev.yaml:ro
      - dev-data:/data
    ports:
      - "127.0.0.1:8099:8099"
    networks:
      default:
        aliases: [agent]   # scraped by the monitoring profile like the real agent
    depends_on:
      fake-llm-gpu: { condition: service_healthy }
      fake-llm-cpu: { condition: service_healthy }
      fake-ha: { condition: service_healthy }
      fake-telegram: { condition: service_healthy }
      fake-stt: { condition: service_healthy }
      fake-tts: { condition: service_healthy }

  fake-llm-gpu: &fake
    profiles: [dev]
    build:
      context: .
      dockerfile: docker/fake-llm/Dockerfile
    image: homelab-agent-fakes:local
    command: ["llm", "--port", "8080"]
    ports: ["127.0.0.1:18080:8080"]

  fake-llm-cpu:
    <<: *fake
    command: ["llm", "--port", "8080"]
    ports: ["127.0.0.1:18081:8080"]

  fake-ha:
    <<: *fake
    command: ["ha", "--port", "8123"]
    environment: { FAKE_HA_TOKEN: fake-ha-token }
    ports: ["127.0.0.1:8123:8123"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/health', timeout=2)"]
      interval: 5s
      retries: 10

  fake-telegram:
    <<: *fake
    command: ["telegram", "--port", "8081"]
    ports: ["127.0.0.1:8081:8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 5s
      retries: 10

  fake-stt:
    <<: *fake
    command: ["stt", "--port", "8080"]
    ports: ["127.0.0.1:18082:8080"]

  fake-tts:
    <<: *fake
    command: ["tts", "--port", "8080"]
    ports: ["127.0.0.1:18083:8080"]

volumes:
  dev-data:
  prometheus-data:
  grafana-data:
